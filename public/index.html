<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Attic — fluorescentmice.fun</title>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="./favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;600;700&family=Syne:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./cover.css" />
  <link rel="stylesheet" href="./enter.css" />
  <link rel="stylesheet" href="./home.css" />
</head>
<body>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <div class="camera" id="camera">
    <main id="stage" class="stage" aria-label="Attic cover">
      <!-- portrait letterbox: responsive swallow flow (canvas) -->
      <div class="stage-void stage-void-top" aria-hidden="true">
        <div class="void-parallax void-parallax-far" aria-hidden="true">
          <div class="void-railing-arch-back" aria-hidden="true"></div>
          <div class="void-railing-back" aria-hidden="true"></div>
        </div>
        <div class="void-parallax void-parallax-mid">
          <div class="void-row void-row-edge">
            <canvas class="void-flow-canvas" data-side="top" data-slot="edge" data-reversed="1"></canvas>
          </div>
          <div class="void-row void-row-inner">
            <canvas class="void-flow-canvas" data-side="top" data-slot="inner" data-reversed="1"></canvas>
          </div>
          <div class="void-row void-row-art">
            <canvas class="void-flow-canvas" data-side="top" data-slot="art" data-reversed="0"></canvas>
          </div>
        </div>
        <div class="void-parallax void-parallax-near" aria-hidden="true">
          <div class="void-railing-arch-front" aria-hidden="true"></div>
          <div class="void-railing-front" aria-hidden="true"></div>
        </div>
      </div>
      <div class="stage-void stage-void-bot" aria-hidden="true">
        <div class="void-parallax void-parallax-far" aria-hidden="true">
          <div class="void-railing-arch-back" aria-hidden="true"></div>
          <div class="void-railing-back" aria-hidden="true"></div>
        </div>
        <div class="void-parallax void-parallax-mid">
          <div class="void-row void-row-art">
            <canvas class="void-flow-canvas" data-side="bot" data-slot="art" data-reversed="1"></canvas>
          </div>
          <div class="void-row void-row-inner">
            <canvas class="void-flow-canvas" data-side="bot" data-slot="inner" data-reversed="0"></canvas>
          </div>
          <div class="void-row void-row-edge">
            <canvas class="void-flow-canvas" data-side="bot" data-slot="edge" data-reversed="0"></canvas>
          </div>
        </div>
        <div class="void-parallax void-parallax-near" aria-hidden="true">
          <div class="void-railing-arch-front" aria-hidden="true"></div>
          <div class="void-railing-front" aria-hidden="true"></div>
        </div>
      </div>
      <!-- horizontals bleed to full viewport width past the verticals -->
      <svg class="frame-rails-bleed" id="rails-bleed" viewBox="0 0 2880 1920" aria-hidden="true"></svg>
      <div class="artboard" id="artboard">
        <svg class="frame-rails z-rails" viewBox="0 0 2880 1920" aria-hidden="true"></svg>

        <img class="layer z-base" data-layer="outline" alt="" draggable="false" />

        <div class="letters z-content" id="letters" aria-label="YOU'RE NOW AT"></div>

        <div class="illustration z-content" id="illustration" aria-label="Attic illustration"></div>

        <img class="layer z-content" data-layer="text-reason" alt="" draggable="false" />
        <img class="layer z-content" data-layer="checklist-text" alt="" draggable="false" />

        <svg class="sketch-underlines z-under-glyphs" viewBox="0 0 2880 1920" aria-hidden="true"></svg>
        <button type="button" class="text-hit text-hit-top z-texthit" id="hit-top-text" aria-label="YOU'RE NOW AT"></button>
        <div class="text-hits-bottom z-texthit" id="hits-bottom-text"></div>

        <svg class="doors doors-shade z-shade" viewBox="0 0 2880 1920" aria-hidden="true">
          <defs>
            <path id="door-left-path" />
            <path id="door-right-path" />
          </defs>
          <use href="#door-left-path" class="door-shade" data-door="left" />
          <use href="#door-right-path" class="door-shade" data-door="right" />
        </svg>

        <div class="wipe z-underline" data-wipe="underline-green">
          <img class="layer" data-layer="underline-green" alt="" draggable="false" />
        </div>
        <div class="wipe z-underline" data-wipe="underline-magenta">
          <img class="layer" data-layer="underline-magenta" alt="" draggable="false" />
        </div>
        <img class="layer pin z-accent" data-layer="pin-green" alt="" draggable="false" />
        <img class="layer pin z-accent" data-layer="pin-magenta" alt="" draggable="false" />

        <div class="marks z-accent" id="marks" aria-hidden="true"></div>

        <!-- idle/hover: text + arrows on doors -->
        <div class="door-swing-plane z-doordeco" id="door-swing-left" data-side="left">
          <img class="layer" data-layer="text-left-fluorescent" alt="" draggable="false" />
          <img class="layer arrow" data-layer="arrow-left" data-arrow="left" alt="" draggable="false" />
        </div>
        <div class="door-swing-plane z-doordeco" id="door-swing-right" data-side="right">
          <img class="layer" data-layer="text-right-florescent" alt="" draggable="false" />
          <img class="layer arrow" data-layer="arrow-right" data-arrow="right" alt="" draggable="false" />
        </div>

        <svg class="doors doors-hit z-hit" viewBox="0 0 2880 1920" aria-hidden="true">
          <a class="door-link" id="door-left-link" href="#home" data-side="left" aria-label="Enter via fluorescentmice.fun">
            <use href="#door-left-path" class="door-hit" data-door="left" />
          </a>
          <a class="door-link" id="door-right-link" href="#home" data-side="right" aria-label="Enter via florescentmice.fun">
            <use href="#door-right-path" class="door-hit" data-door="right" />
          </a>
        </svg>

        <!-- PNG 失败时：纯 SVG + 字体占位，避免浏览器破图叠字 -->
        <div class="cover-fallback" id="cover-fallback" hidden>
          <svg class="cover-fallback-art" viewBox="0 0 720 480" role="img" aria-labelledby="cover-fallback-title">
            <title id="cover-fallback-title">Attic 封面占位</title>
            <defs>
              <pattern id="fb-stripes" patternUnits="userSpaceOnUse" width="18" height="40" patternTransform="skewX(-28)">
                <rect width="9" height="40" fill="#1a1a18"/>
              </pattern>
            </defs>
            <!-- twin door arches -->
            <g fill="none" stroke="#3a3b4a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M118 360 V188 C118 118 168 78 218 78 C268 78 318 118 318 188 V360"/>
              <path d="M402 360 V188 C402 118 452 78 502 78 C552 78 602 118 602 188 V360"/>
              <path d="M168 360 V210"/>
              <path d="M268 360 V210"/>
              <path d="M452 360 V210"/>
              <path d="M552 360 V210"/>
            </g>
            <circle cx="198" cy="250" r="6" fill="#5e5f70"/>
            <circle cx="532" cy="250" r="6" fill="#5e5f70"/>
            <!-- barrier + cone -->
            <g transform="translate(248 292)">
              <rect x="0" y="8" width="168" height="28" rx="2" fill="#e0b045"/>
              <rect x="0" y="8" width="168" height="28" rx="2" fill="url(#fb-stripes)"/>
              <rect x="4" y="36" width="5" height="14" rx="1" fill="#5a4636"/>
              <rect x="159" y="36" width="5" height="14" rx="1" fill="#5a4636"/>
              <text class="cover-fallback-barrier" x="84" y="28" text-anchor="middle">施工中</text>
              <g transform="translate(178 -6)">
                <ellipse cx="20" cy="54" rx="14" ry="3" fill="#3d291c" opacity="0.28"/>
                <path d="M6 50 L20 4 L34 50 Z" fill="#e07a3a"/>
                <path d="M10 50 L20 10 L30 50 Z" fill="#c45c4a"/>
                <rect x="5" y="48" width="30" height="5" rx="1" fill="#1a1a18"/>
                <rect x="12" y="22" width="16" height="4" rx="1" fill="#f7f1e4"/>
                <rect x="10" y="34" width="20" height="4" rx="1" fill="#f7f1e4"/>
              </g>
            </g>
          </svg>
          <div class="cover-fallback-copy">
            <p class="cover-fallback-brand">Attic</p>
            <p class="cover-fallback-lede">阁楼门还在，画暂时没跟上。</p>
            <div class="cover-fallback-actions">
              <button type="button" class="cover-fallback-btn" data-enter="left">fluorescentmice.fun</button>
              <button type="button" class="cover-fallback-btn" data-enter="right">florescentmice.fun</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- above home + outside .stage hole-mask so the leaf stays solid -->
    <div class="door-enter-layer" id="door-enter-layer" aria-hidden="true">
      <svg class="door-beyond" viewBox="0 0 2880 1920" aria-hidden="true">
        <defs>
          <radialGradient id="door-beyond-glow" cx="50%" cy="45%" r="65%">
            <stop offset="0%" stop-color="#fffef6" stop-opacity="1" />
            <stop offset="45%" stop-color="#f4f0ff" stop-opacity="0.95" />
            <stop offset="100%" stop-color="#dee1f6" stop-opacity="0.2" />
          </radialGradient>
        </defs>
        <path id="door-beyond-path" fill="url(#door-beyond-glow)" />
      </svg>
      <div class="door-pivot" id="door-pivot">
        <div class="door-pivot-root" id="door-pivot-root">
          <div class="door-leaf-thickness" id="door-leaf-thickness" aria-hidden="true"></div>
          <div class="door-face-plane" id="door-face-plane">
            <svg class="door-leaf-svg" viewBox="0 0 2880 1920" aria-hidden="true">
              <path id="door-leaf-path" class="door-leaf-face" fill="#5e5f70" />
            </svg>
            <div class="door-pivot-deco" id="door-pivot-deco"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

    <div class="home-frame">
