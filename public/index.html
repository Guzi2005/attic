<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Attic — fluorescentmice.fun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;600;700&family=Syne:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./cover.css" />
  <link rel="stylesheet" href="./enter.css" />
  <link rel="stylesheet" href="./home.css" />
</head>
<body>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <div class="camera" id="camera">
    <main id="stage" class="stage" aria-label="Attic cover">
      <!-- portrait letterbox: max 2 swallow rows (artboard first, then edges) -->
      <div class="stage-void stage-void-top" aria-hidden="true">
        <div class="void-row void-row-edge"></div>
        <div class="void-row void-row-mid"></div>
        <div class="void-row void-row-art"></div>
      </div>
      <div class="stage-void stage-void-bot" aria-hidden="true">
        <div class="void-row void-row-art"></div>
        <div class="void-row void-row-mid"></div>
        <div class="void-row void-row-edge"></div>
      </div>
      <!-- horizontals bleed to full viewport width past the verticals -->
      <svg class="frame-rails-bleed" id="rails-bleed" viewBox="0 0 2880 1920" aria-hidden="true"></svg>
      <div class="artboard" id="artboard">
        <svg class="frame-rails z-rails" viewBox="0 0 2880 1920" aria-hidden="true"></svg>

        <img class="layer z-base" data-layer="outline" alt="" draggable="false" />

        <div class="letters z-content" id="letters" aria-label="YOU'RE NOW AT"></div>

        <div class="illustration z-content" id="illustration" aria-label="Attic illustration"></div>

        <img class="layer z-content" data-layer="text-reason" alt="The Reason I'm Here:" draggable="false" />
        <img class="layer z-content" data-layer="checklist-text" alt="" draggable="false" />

        <svg class="sketch-underlines z-under-glyphs" viewBox="0 0 2880 1920" aria-hidden="true"></svg>
        <button type="button" class="text-hit text-hit-top z-texthit" id="hit-top-text" aria-label="YOU'RE NOW AT"></button>
        <div class="text-hits-bottom z-texthit" id="hits-bottom-text"></div>

        <svg class="doors doors-shade z-shade" viewBox="0 0 2880 1920" aria-hidden="true">
          <defs>
            <path id="door-left-path" />
            <path id="door-right-path" />
          </defs>
          <use href="#door-left-path" class="door-shade" data-door="left" />
          <use href="#door-right-path" class="door-shade" data-door="right" />
        </svg>

        <div class="wipe z-underline" data-wipe="underline-green">
          <img class="layer" data-layer="underline-green" alt="" draggable="false" />
        </div>
        <div class="wipe z-underline" data-wipe="underline-magenta">
          <img class="layer" data-layer="underline-magenta" alt="" draggable="false" />
        </div>
        <img class="layer pin z-accent" data-layer="pin-green" alt="" draggable="false" />
        <img class="layer pin z-accent" data-layer="pin-magenta" alt="" draggable="false" />

        <div class="marks z-accent" id="marks" aria-hidden="true"></div>

        <svg class="door-beyond z-beyond" viewBox="0 0 2880 1920" aria-hidden="true">
          <defs>
            <radialGradient id="door-beyond-glow" cx="50%" cy="45%" r="65%">
              <stop offset="0%" stop-color="#fffef6" stop-opacity="1" />
              <stop offset="45%" stop-color="#f4f0ff" stop-opacity="0.95" />
              <stop offset="100%" stop-color="#dee1f6" stop-opacity="0.2" />
            </radialGradient>
          </defs>
          <path id="door-beyond-path" fill="url(#door-beyond-glow)" />
        </svg>

        <!-- idle/hover: text + arrows on doors -->
        <div class="door-swing-plane z-doordeco" id="door-swing-left" data-side="left">
          <img class="layer" data-layer="text-left-fluorescent" alt="fluorescentmice.fun" draggable="false" />
          <img class="layer arrow" data-layer="arrow-left" data-arrow="left" alt="" draggable="false" />
        </div>
        <div class="door-swing-plane z-doordeco" id="door-swing-right" data-side="right">
          <img class="layer" data-layer="text-right-florescent" alt="florescentmice.fun" draggable="false" />
          <img class="layer arrow" data-layer="arrow-right" data-arrow="right" alt="" draggable="false" />
        </div>

        <!-- enter: one 3D pivot = Z-extruded leaf + face + clipped deco -->
        <div class="door-pivot z-doorleaf" id="door-pivot" aria-hidden="true">
          <div class="door-pivot-root" id="door-pivot-root">
            <div class="door-leaf-thickness" id="door-leaf-thickness" aria-hidden="true"></div>
            <div class="door-face-plane" id="door-face-plane">
              <svg class="door-leaf-svg" viewBox="0 0 2880 1920" aria-hidden="true">
                <path id="door-leaf-path" class="door-leaf-face" fill="#5e5f70" />
              </svg>
              <div class="door-pivot-deco" id="door-pivot-deco"></div>
            </div>
          </div>
        </div>

        <svg class="doors doors-hit z-hit" viewBox="0 0 2880 1920" aria-hidden="true">
          <a class="door-link" id="door-left-link" href="#home" data-side="left" aria-label="Enter via fluorescentmice.fun">
            <use href="#door-left-path" class="door-hit" data-door="left" />
          </a>
          <a class="door-link" id="door-right-link" href="#home" data-side="right" aria-label="Enter via florescentmice.fun">
            <use href="#door-right-path" class="door-hit" data-door="right" />
          </a>
        </svg>
      </div>
    </main>
  </div>

  <section class="home" id="home" aria-hidden="true" aria-label="Home">
    <div class="home-atmosphere" aria-hidden="true"></div>
    <div class="home-frame">
      <nav class="bento" aria-label="功能入口 mock">
        <a class="tile c-sky span-banner" href="#about">
          <svg class="motif motif-banner" viewBox="0 0 120 28" aria-hidden="true">
            <circle cx="98" cy="9" r="5" fill="#e8c84a"/>
            <path d="M8 22 Q28 6 48 18 T88 16 L120 22 L120 28 L0 28 Z" fill="#6a8f52"/>
            <rect x="18" y="10" width="14" height="12" fill="#c45c4a"/>
            <path d="M16 10 H34 L30 6 H20 Z" fill="#f0e6d2"/>
          </svg>
          <span class="tile-title">关于阁楼</span>
        </a>

        <a class="tile c-blue span-pear" href="#materials">
          <svg class="motif" viewBox="0 0 40 48" aria-hidden="true">
            <ellipse cx="20" cy="28" rx="12" ry="14" fill="#e8c84a"/>
            <path d="M20 12 C20 12 28 8 30 14" fill="none" stroke="#4a6b38" stroke-width="2"/>
            <ellipse cx="28" cy="12" rx="5" ry="3" fill="#6a8f52"/>
          </svg>
          <span class="tile-title">素材箱</span>
        </a>

        <a class="tile c-brown span-cow" href="#tools">
          <svg class="motif" viewBox="0 0 72 40" aria-hidden="true">
            <ellipse cx="40" cy="22" rx="22" ry="12" fill="#f0e6d2"/>
            <ellipse cx="16" cy="20" rx="9" ry="8" fill="#f0e6d2"/>
            <ellipse cx="11" cy="16" rx="2.2" ry="4" fill="#f0e6d2"/>
            <ellipse cx="18" cy="15" rx="2.2" ry="4" fill="#f0e6d2"/>
            <circle cx="12" cy="20" r="1.4" fill="#1a1a18"/>
            <ellipse cx="32" cy="18" rx="5" ry="4" fill="#1a1a18"/>
            <ellipse cx="50" cy="24" rx="6" ry="5" fill="#1a1a18"/>
            <rect x="30" y="30" width="3.5" height="8" rx="1" fill="#1a1a18"/>
            <rect x="48" y="30" width="3.5" height="8" rx="1" fill="#1a1a18"/>
          </svg>
          <span class="tile-title">工具集</span>
        </a>

        <div class="home-hello span-hello">
          <p class="home-brand">Attic</p>
          <h1 class="home-title">嗨，我是 guzi。</h1>
          <p class="home-lede">
            全栈开发 × 手绘设计。<br />
            这里是不断生长的互联网角落——访客不会空手而归。
          </p>
        </div>

        <a class="tile c-butter span-sheep" href="#trophies">
          <svg class="motif" viewBox="0 0 64 40" aria-hidden="true">
            <circle cx="34" cy="18" r="9" fill="#f7f1e4"/>
            <circle cx="26" cy="22" r="8" fill="#f7f1e4"/>
            <circle cx="42" cy="22" r="8" fill="#f7f1e4"/>
            <circle cx="34" cy="26" r="8" fill="#f7f1e4"/>
            <circle cx="18" cy="20" r="6" fill="#1a1a18"/>
            <circle cx="15" cy="18" r="1.2" fill="#f7f1e4"/>
            <rect x="24" y="28" width="3" height="9" rx="1" fill="#1a1a18"/>
            <rect x="38" y="29" width="3" height="8" rx="1" fill="#1a1a18"/>
            <rect x="44" y="28" width="3" height="9" rx="1" fill="#1a1a18"/>
          </svg>
          <span class="tile-title">奖杯柜</span>
        </a>

        <a class="tile c-moss span-corn" href="#lab">
          <svg class="motif" viewBox="0 0 36 56" aria-hidden="true">
            <path d="M10 18 C4 28 5 42 12 50 L14 28 Z" fill="#7aab5a"/>
            <path d="M26 18 C32 28 31 42 24 50 L22 28 Z" fill="#6a9a4a"/>
            <ellipse cx="18" cy="28" rx="7" ry="18" fill="#e8c84a"/>
            <circle cx="16" cy="18" r="1.3" fill="#c49a2e"/>
            <circle cx="20" cy="22" r="1.3" fill="#c49a2e"/>
            <circle cx="16" cy="26" r="1.3" fill="#c49a2e"/>
            <circle cx="20" cy="30" r="1.3" fill="#c49a2e"/>
            <circle cx="16" cy="34" r="1.3" fill="#c49a2e"/>
            <circle cx="20" cy="38" r="1.3" fill="#c49a2e"/>
            <path d="M18 8 C14 12 14 16 18 12 C22 16 22 12 18 8 Z" fill="#5f8a4e"/>
          </svg>
          <span class="tile-title">实验桌</span>
        </a>

        <a class="tile c-mustard span-star" href="#notes">
          <svg class="motif" viewBox="0 0 48 48" aria-hidden="true">
            <rect x="18" y="18" width="12" height="12" transform="rotate(45 24 24)" fill="#f0e6d2"/>
            <path fill="#d29aa4" d="M24 4 L28 16 L24 20 L20 16 Z"/>
            <path fill="#d29aa4" d="M44 24 L32 28 L28 24 L32 20 Z"/>
            <path fill="#d29aa4" d="M24 44 L20 32 L24 28 L28 32 Z"/>
            <path fill="#d29aa4" d="M4 24 L16 20 L20 24 L16 28 Z"/>
            <path fill="#c47352" d="M24 16 L28 24 L24 32 L20 24 Z"/>
          </svg>
          <span class="tile-title">旅途小记</span>
        </a>

        <a class="tile c-blue span-flower" href="#inbox">
          <svg class="motif" viewBox="0 0 28 56" aria-hidden="true">
            <path d="M14 52 V22" stroke="#4a6b38" stroke-width="2"/>
            <circle cx="14" cy="16" r="8" fill="#c45c4a"/>
            <circle cx="14" cy="16" r="3" fill="#e8c84a"/>
          </svg>
          <span class="tile-title">来信</span>
        </a>

        <a class="tile c-olive span-cow2" href="#garden">
          <svg class="motif" viewBox="0 0 72 40" aria-hidden="true">
            <ellipse cx="32" cy="22" rx="22" ry="12" fill="#f0e6d2"/>
            <ellipse cx="56" cy="20" rx="9" ry="8" fill="#f0e6d2"/>
            <ellipse cx="61" cy="16" rx="2.2" ry="4" fill="#f0e6d2"/>
            <ellipse cx="54" cy="15" rx="2.2" ry="4" fill="#f0e6d2"/>
            <circle cx="60" cy="20" r="1.4" fill="#1a1a18"/>
            <ellipse cx="22" cy="18" rx="5" ry="4" fill="#1a1a18"/>
            <ellipse cx="40" cy="24" rx="6" ry="5" fill="#1a1a18"/>
            <rect x="20" y="30" width="3.5" height="8" rx="1" fill="#1a1a18"/>
            <rect x="38" y="30" width="3.5" height="8" rx="1" fill="#1a1a18"/>
          </svg>
          <span class="tile-title">拼布花园</span>
        </a>

        <a class="tile c-forest span-rabbit" href="#garden">
          <svg class="motif" viewBox="0 0 72 40" aria-hidden="true">
            <ellipse cx="40" cy="26" rx="16" ry="9" fill="#f0e6d2"/>
            <ellipse cx="24" cy="22" rx="8" ry="7" fill="#f0e6d2"/>
            <ellipse cx="18" cy="10" rx="3" ry="9" fill="#f0e6d2"/>
            <ellipse cx="25" cy="9" rx="3" ry="9" fill="#f0e6d2"/>
            <ellipse cx="16" cy="8" rx="1.6" ry="5" fill="#e8b8c0"/>
            <ellipse cx="24" cy="7" rx="1.6" ry="5" fill="#e8b8c0"/>
            <circle cx="28" cy="20" r="1.5" fill="#c47352"/>
            <ellipse cx="54" cy="24" rx="4" ry="3" fill="#f0e6d2"/>
            <path d="M48 30 Q52 34 56 30" fill="none" stroke="#c47352" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="tile-title">拼布花园</span>
        </a>
      </nav>
    </div>
  </section>

  <script type="module" src="./cover.js"></script>
</body>
</html>
