<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Attic · 作品集维护</title>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@500;600;700&family=Syne:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./folio-edit.css" />
</head>
<body>
  <div class="desk">
    <header class="desk-bar">
      <div class="desk-bar__brand">
        <p class="desk-kicker">ATTIC / DRAFT</p>
        <h1>作品集维护</h1>
      </div>
      <p class="desk-note">改的是 <code>works.json</code>。本机可直接保存；线上静态托管请下载后再提交。</p>
      <div class="desk-actions">
        <button type="button" id="btn-reload">重新读取</button>
        <button type="button" id="btn-download">下载 JSON</button>
        <button type="button" id="btn-copy">复制 JSON</button>
        <label class="file-btn">导入<input type="file" id="file-import" accept="application/json,.json" /></label>
        <button type="button" class="primary" id="btn-save">保存到仓库</button>
      </div>
    </header>

    <p class="desk-status" id="status" role="status">正在读取作品清单…</p>

    <main class="desk-body">
      <aside class="rail">
        <div class="rail-head">
          <span id="work-count">0</span> 条
          <button type="button" class="primary" id="btn-new">+ 新建</button>
        </div>
        <ol class="work-list" id="work-list"></ol>
      </aside>

      <section class="sheet" id="sheet" hidden>
        <div class="sheet-toolbar">
          <button type="button" id="btn-up">上移</button>
          <button type="button" id="btn-down">下移</button>
          <button type="button" id="btn-dup">复制</button>
          <button type="button" class="danger" id="btn-del">删除</button>
        </div>

        <form id="form" class="form" autocomplete="off">
          <label>id / 短名
            <input name="id" required placeholder="irisvista" />
          </label>
          <label>标题
            <input name="title" required placeholder="云上虹 IrisVista" />
          </label>
          <label class="span-2">简介
            <textarea name="blurb" rows="5" required></textarea>
          </label>
          <label>封面图 URL
            <input name="image" placeholder="./parts/portfolio/foo.png 或 https://" />
          </label>
          <label>主链接
            <input name="url" placeholder="https://" />
          </label>
          <label>来源
            <select name="source">
              <option value="bugoo">Bugoo</option>
              <option value="fluorescentmice">fluorescentmice</option>
              <option value="cursor">Cursor</option>
              <option value="bilibili">Bilibili</option>
              <option value="other">other</option>
            </select>
          </label>
          <label>标签（逗号分隔）
            <input name="tags" placeholder="Godot, 叙事, 历史" />
          </label>
          <label>开始
            <input name="started" placeholder="2026-08 或 2026-08-08" />
          </label>
          <label>最后更新
            <input name="updated" placeholder="2026-09-19" />
          </label>
          <label>结束
            <input name="ended" placeholder="留空则用最后更新日期" />
          </label>

          <fieldset class="span-2 links-box">
            <legend>版面块</legend>
            <p class="hint">图和文字可以拆成多块、顺序自定。留空则按主图 + 简介自动拆段。插图按原长宽比排，不必裁成方块。</p>
            <div id="blocks-rows"></div>
            <button type="button" id="btn-add-image">+ 插图</button>
            <button type="button" id="btn-add-text">+ 文字</button>
          </fieldset>

          <fieldset class="span-2 links-box">
            <legend>聚类链接</legend>
            <p class="hint">同一作品的 GitHub / B 站合集 / 站点 / Itch 放这里。主链接也会出现在卡片上。</p>
            <div id="links-rows"></div>
            <button type="button" id="btn-add-link">+ 加一条链接</button>
          </fieldset>
        </form>

        <figure class="preview" hidden>
          <img id="preview-img" alt="" />
          <figcaption id="preview-cap"></figcaption>
        </figure>
      </section>

      <p class="sheet-empty" id="sheet-empty">左侧点一条，或按「新建」。</p>
    </main>
  </div>
  <script type="module" src="./folio-edit.js"></script>
</body>
</html>
